<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d3d5da" />
  <title>Atlas of Influence</title>
  <meta name="description" content="A map of how actors, platforms, AI models and crowds shape what appears on a phone screen, with the sources behind every claim." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Caveat:wght@600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage"></div>

  <!-- The phone's screen. Laid out at 390×845 and scaled to sit exactly on the 3D screen. -->
  <div id="screen">
    <div class="statusbar"><span id="clock">9:41</span><span class="notch"></span><span class="sb-icons">▮▮▮ ◔</span></div>

    <section id="home" aria-label="Apps">
      <div class="grid" id="grid"></div>
      <p class="hint">tap an app</p>
    </section>

    <section id="app" aria-label="Influence facts" hidden>
      <header class="app-head">
        <button class="nav" data-act="prev" aria-label="Previous app">‹</button>
        <h1 id="app-name">App</h1>
        <button class="nav" data-act="next" aria-label="Next app">›</button>
      </header>
      <div class="sheet-scroll" id="sheet"></div>
      <div class="app-foot">
        <button class="btn-explore" data-act="explore">Explore what's behind <span aria-hidden="true">↗</span></button>
      </div>
    </section>

    <div class="home-bar" data-act="home" role="button" aria-label="Home"></div>
  </div>

  <!-- Chrome around the 3D stage. -->
  <div id="hud">
    <div class="brand">Atlas of Influence</div>
    <a class="framework-link" href="./framework.html">The framework →</a>
    <button id="back" class="back" hidden>← Back</button>
    <button id="reset" class="reset" hidden>Reset view</button>
    <div id="tip" class="tip" hidden></div>
    <ul id="legend" class="legend" hidden aria-label="How to read the scene">
      <li><i class="k-cube"></i>actor</li>
      <li><i class="k-hollow"></i>front or fake account</li>
      <li><i class="k-line path"></i>path of a case</li>
      <li><i class="k-line check"></i>check: reporting, research, regulators</li>
      <li><i class="k-line own"></i>ownership</li>
      <li><i class="k-line thread"></i>narrative</li>
    </ul>
  </div>

  <!-- Explore: choose what to look at, read about it, and open its sources. The 3D scene follows. -->
  <aside id="panel" hidden aria-label="Explore the atlas">
    <button id="panel-grip" class="panel-grip" aria-label="Show or hide the panel"><span></span></button>
    <div id="panel-body"></div>
  </aside>

  <div id="loading">loading…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
